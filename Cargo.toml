[package]
name = "birda-to-ebird"
version = "0.1.0"
edition = "2021"
description = "Convert Birda CSV exports into eBird Record Format CSV files"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tzf-rs = "1.3.6"
zip = "4"
